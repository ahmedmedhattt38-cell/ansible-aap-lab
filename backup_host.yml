---
- name: Back up important files
  hosts: all
  gather_facts: true

  vars:
    backup_source: /etc
    timestamp: "{{ lookup('pipe', 'date +%Y%m%d-%H%M%S') }}"

  tasks:
    - name: Find a writable backup directory
      ansible.builtin.shell: |
        for candidate in /var/backups /tmp/maintenance-backups; do
          if mkdir -p "$candidate" 2>/dev/null && [ -w "$candidate" ]; then
            echo "$candidate"
            exit 0
          fi
        done
        echo /tmp
      register: backup_dir_lookup
      changed_when: false

    - name: Set the archive path
      ansible.builtin.set_fact:
        backup_dir: "{{ backup_dir_lookup.stdout | trim }}"
        archive_path: "{{ (backup_dir_lookup.stdout | trim) }}/{{ backup_source | basename }}-{{ timestamp }}.tar.gz"

    - name: Create the compressed archive
      ansible.builtin.shell: >-
        tar --ignore-failed-read -czf {{ archive_path }}
        -C {{ backup_source | dirname }} {{ backup_source | basename }}
      register: backup_archive_result

    - name: Read the archive details
      ansible.builtin.stat:
        path: "{{ archive_path }}"
      register: archive_stat

    - name: Fail when the archive was not created
      ansible.builtin.fail:
        msg: "The archive could not be created at {{ archive_path }}"
      when: not archive_stat.stat.exists

    - name: Record the backup artifacts
      ansible.builtin.set_stats:
        data:
          backup_status: created
          backup_archive: "{{ archive_path }}"
          backup_size_mb: "{{ (archive_stat.stat.size / 1048576) | round(2) }}"

    - name: Display the backup result
      ansible.builtin.debug:
        msg:
          - "Archive: {{ archive_path }}"
          - "Size: {{ (archive_stat.stat.size / 1048576) | round(2) }} MB"
