---
- name: Apply security updates
  hosts: all
  gather_facts: true

  vars:
    patch_status: not-run
    patch_command: "{{ package_manager.stdout }} -y update{{ ' --security' if package_manager.stdout in ['dnf', 'yum'] else '' }}"

  tasks:
    - name: Detect the available package manager
      ansible.builtin.shell: |
        for tool in dnf yum microdnf; do
          if command -v "$tool" >/dev/null 2>&1; then
            echo "$tool"
            exit 0
          fi
        done
        echo none
      register: package_manager
      changed_when: false

    - name: Record the kernel before patching
      ansible.builtin.command: uname -r
      register: kernel_before
      changed_when: false

    - name: Apply the updates
      ansible.builtin.command: "{{ patch_command }}"
      register: patch_result
      changed_when: false
      failed_when: false
      when: package_manager.stdout != 'none'

    - name: Capture the patch output
      ansible.builtin.set_fact:
        patch_output: "{{ (patch_result.stdout | default('')) ~ '\n' ~ (patch_result.stderr | default('')) }}"

    - name: Interpret the patch outcome
      ansible.builtin.set_fact:
        patch_status: >-
          {%- if package_manager.stdout == 'none' -%}skipped-no-package-manager
          {%- elif (patch_result.rc | default(0)) in [0, 100] -%}completed
          {%- elif 'repositor' in (patch_output | lower) -%}skipped-no-repositories
          {%- elif ('permission denied' in (patch_output | lower)) or ('failed to create' in (patch_output | lower)) or ('read-only' in (patch_output | lower)) -%}skipped-insufficient-privileges
          {%- else -%}failed
          {%- endif -%}

    - name: Check whether a reboot is required
      ansible.builtin.command: dnf needs-restarting -r
      register: reboot_check
      changed_when: false
      failed_when: false
      when:
        - package_manager.stdout == 'dnf'
        - patch_status == 'completed'

    - name: Fail the job when patching did not work
      ansible.builtin.fail:
        msg: "{{ patch_output | trim }}"
      when: patch_status == 'failed'

    - name: Record the patch artifacts
      ansible.builtin.set_stats:
        data:
          patch_tool: "{{ package_manager.stdout }}"
          patch_status: "{{ patch_status }}"
          patch_kernel_before: "{{ kernel_before.stdout }}"
          patch_reboot_required: "{{ (reboot_check.rc | default(0)) == 1 }}"

    - name: Display the patch result
      ansible.builtin.debug:
        msg:
          - "Package manager: {{ package_manager.stdout }}"
          - "Kernel before: {{ kernel_before.stdout }}"
          - "Status: {{ patch_status }}"
          - "Reboot required: {{ (reboot_check.rc | default(0)) == 1 }}"
