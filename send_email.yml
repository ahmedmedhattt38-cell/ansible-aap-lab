---
- name: Send a greeting email to Ahmed
  hosts: all
  gather_facts: false

  vars_prompt:
    - name: smtp_username
      prompt: Gmail sender address
      private: false

    - name: smtp_app_password
      prompt: Gmail App Password
      private: true

  vars:
    recipient: ahmedmedhatt38@gmail.com
    clean_smtp_username: "{{ smtp_username | trim }}"
    clean_smtp_app_password: "{{ smtp_app_password | regex_replace('\\s+', '') }}"

  tasks:
    - name: Validate the App Password format
      ansible.builtin.assert:
        that:
          - clean_smtp_app_password | length == 16
        fail_msg: Enter a valid 16-character Google App Password.
        success_msg: The App Password format is valid.
      no_log: true

    - name: Send the email through Gmail
      ansible.builtin.shell:
        cmd: |
          python3 - <<'PY'
          import os
          import smtplib
          import ssl
          from email.message import EmailMessage

          username = os.environ['SMTP_USER']
          password = os.environ['SMTP_PASS']

          message = EmailMessage()
          message['From'] = username
          message['To'] = os.environ['SMTP_TO']
          message['Subject'] = 'Hello Ahmed'
          message.set_content('Hello Ahmed')

          context = ssl.create_default_context()
          with smtplib.SMTP('smtp.gmail.com', 587, timeout=30) as server:
              server.starttls(context=context)
              server.login(username, password)
              server.send_message(message)

          print('Email sent to ' + os.environ['SMTP_TO'])
          PY
      environment:
        SMTP_USER: "{{ clean_smtp_username }}"
        SMTP_PASS: "{{ clean_smtp_app_password }}"
        SMTP_TO: "{{ recipient }}"
      no_log: true
      register: mail_result

    - name: Show the result
      ansible.builtin.debug:
        msg: "{{ mail_result.stdout }}"
