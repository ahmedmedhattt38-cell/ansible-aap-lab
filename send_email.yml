---
- name: Send a greeting email to Ahmed
  hosts: all
  gather_facts: false

  vars_prompt:
    - name: smtp_username
      prompt: Gmail sender address
      private: false

    - name: smtp_app_password
      prompt: Gmail App Password
      private: true

  vars:
    recipient: ahmedmedhatt38@gmail.com
    subject: Hello Ahmed
    message: Hello Ahmed
    smtp_host: smtp.gmail.com
    smtp_port: 587
    smtp_starttls: true
    signature: |-
      --
      Made by Ansible
      Ahmed Medhat style
      Les go
    outcome_file: /tmp/email_result.txt
    clean_smtp_username: "{{ smtp_username | trim }}"
    clean_smtp_app_password: "{{ smtp_app_password | regex_replace('\\s+', '') }}"

  tasks:
    - name: Validate the App Password format
      ansible.builtin.assert:
        that:
          - clean_smtp_app_password | length == 16
        fail_msg: Enter a valid 16-character Google App Password.
        success_msg: The App Password format is valid.
      no_log: true

    - name: Send the email
      ansible.builtin.shell:
        cmd: |
          python3 - <<'PY'
          import os
          import smtplib
          import ssl
          from email.message import EmailMessage

          username = os.environ['SMTP_USER']
          password = os.environ['SMTP_PASS']
          to_address = os.environ['SMTP_TO']
          subject = os.environ['SMTP_SUBJECT']
          body = os.environ['SMTP_BODY']
          signature = os.environ['SMTP_SIGNATURE']
          host = os.environ['SMTP_HOST']
          port = int(os.environ['SMTP_PORT'])
          use_starttls = os.environ['SMTP_STARTTLS'] == 'true'
          outcome_file = os.environ['OUTCOME_FILE']

          try:
              message = EmailMessage()
              message['From'] = username
              message['To'] = to_address
              message['Subject'] = subject
              message.set_content(body.rstrip() + '\n\n' + signature + '\n')

              context = ssl.create_default_context()
              with smtplib.SMTP(host, port, timeout=30) as server:
                  if use_starttls:
                      server.starttls(context=context)
                  server.login(username, password)
                  server.send_message(message)

              outcome = 'Email sent to ' + to_address + ' with subject "' + subject + '"'
          except Exception as error:
              detail = str(error).replace(password, '***').replace(username, '***')
              outcome = 'SMTP failure: ' + type(error).__name__ + ': ' + detail

          with open(outcome_file, 'w') as handle:
              handle.write(outcome + '\n')
          PY
      environment:
        SMTP_USER: "{{ clean_smtp_username }}"
        SMTP_PASS: "{{ clean_smtp_app_password }}"
        SMTP_TO: "{{ recipient }}"
        SMTP_SUBJECT: "{{ subject }}"
        SMTP_BODY: "{{ message }}"
        SMTP_SIGNATURE: "{{ signature }}"
        SMTP_HOST: "{{ smtp_host }}"
        SMTP_PORT: "{{ smtp_port }}"
        SMTP_STARTTLS: "{{ smtp_starttls | lower }}"
        OUTCOME_FILE: "{{ outcome_file }}"
      no_log: true
      run_once: true

    - name: Read the email outcome
      ansible.builtin.slurp:
        src: "{{ outcome_file }}"
      register: email_outcome
      run_once: true

    - name: Report the email outcome
      ansible.builtin.debug:
        msg: "{{ email_outcome.content | b64decode | trim }}"
      run_once: true

    - name: Fail when the email could not be sent
      ansible.builtin.fail:
        msg: "{{ email_outcome.content | b64decode | trim }}"
      when: "'Email sent' not in (email_outcome.content | b64decode)"
      run_once: true
