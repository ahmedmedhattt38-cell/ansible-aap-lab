---
- name: Email the maintenance result
  hosts: all
  gather_facts: true

  vars:
    smtp_host: smtp.gmail.com
    smtp_port: 587
    smtp_starttls: true
    recipient: ahmedmedhatt38@gmail.com
    subject: Maintenance result
    message: ""
    outcome_file: /tmp/maintenance_email_result.txt
    signature: |-
      --
      Made by Ansible
      Ahmed Medhat style
      Les go
    clean_smtp_username: "{{ smtp_username | trim }}"
    clean_smtp_app_password: "{{ smtp_app_password | regex_replace('\\s+', '') }}"
    report: |-
      Maintenance report for {{ ansible_facts.hostname | default('host') }}

      Backup:   {{ backup_status | default('not reported') }}
      Archive:  {{ backup_archive | default('none') }}
      Size:     {{ backup_size_mb | default('n/a') }} MB
      Patch:    {{ patch_status | default('not reported') }}
      Reboot:   {{ patch_reboot_required | default('unknown') }}
      Validate: {{ validation_status | default('not reported') }}
      Detail:   {{ validation_detail | default('none') }}

      {{ message }}

  tasks:
    - name: Validate the App Password format
      ansible.builtin.assert:
        that:
          - clean_smtp_app_password | length == 16
        fail_msg: Enter a valid 16-character Google App Password.
      no_log: true

    - name: Send the report email
      ansible.builtin.shell:
        cmd: |
          python3 - <<'PY'
          import os
          import smtplib
          import ssl
          from email.message import EmailMessage

          username = os.environ['SMTP_USER']
          password = os.environ['SMTP_PASS']
          outcome_file = os.environ['OUTCOME_FILE']

          try:
              message = EmailMessage()
              message['From'] = username
              message['To'] = os.environ['SMTP_TO']
              message['Subject'] = os.environ['SMTP_SUBJECT']
              message.set_content(
                  os.environ['SMTP_REPORT'].rstrip() + '\n\n' + os.environ['SMTP_SIGNATURE'] + '\n'
              )

              context = ssl.create_default_context()
              with smtplib.SMTP(os.environ['SMTP_HOST'], int(os.environ['SMTP_PORT']), timeout=30) as server:
                  if os.environ['SMTP_STARTTLS'] == 'true':
                      server.starttls(context=context)
                  server.login(username, password)
                  server.send_message(message)

              outcome = 'Email sent to ' + message['To']
          except Exception as error:
              detail = str(error).replace(password, '***').replace(username, '***')
              outcome = 'SMTP failure: ' + type(error).__name__ + ': ' + detail

          with open(outcome_file, 'w') as handle:
              handle.write(outcome + '\n')
          PY
      environment:
        SMTP_USER: "{{ clean_smtp_username }}"
        SMTP_PASS: "{{ clean_smtp_app_password }}"
        SMTP_TO: "{{ recipient }}"
        SMTP_SUBJECT: "{{ subject }}"
        SMTP_REPORT: "{{ report }}"
        SMTP_SIGNATURE: "{{ signature }}"
        SMTP_HOST: "{{ smtp_host }}"
        SMTP_PORT: "{{ smtp_port }}"
        SMTP_STARTTLS: "{{ smtp_starttls | lower }}"
        OUTCOME_FILE: "{{ outcome_file }}"
      no_log: true

    - name: Read the email outcome
      ansible.builtin.slurp:
        src: "{{ outcome_file }}"
      register: email_outcome

    - name: Report the email outcome
      ansible.builtin.debug:
        msg: "{{ email_outcome.content | b64decode | trim }}"

    - name: Fail when the email could not be sent
      ansible.builtin.fail:
        msg: "{{ email_outcome.content | b64decode | trim }}"
      when: "'Email sent' not in (email_outcome.content | b64decode)"
